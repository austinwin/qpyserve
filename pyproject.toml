[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpyserve"
version = "0.1.1"
description = "Run FastAPI with HTML, React, or Vue on one host using one Python command"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qpyserve contributors" }]
keywords = ["fastapi", "vite", "react", "vue", "web", "asgi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "build>=1.2"]

[project.urls]
Repository = "https://github.com/austinwin/qpyserve"
Issues = "https://github.com/austinwin/qpyserve/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

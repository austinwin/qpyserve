[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpyserve"
version = "0.2.0"
description = "One-command FastAPI with HTML, React, Vue, and a single web origin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qpyserve contributors" }]
keywords = ["fastapi", "vite", "react", "vue", "web", "asgi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2", "ruff>=0.9,<1"]

[project.scripts]
qpyserve = "qpyserve._cli:main"

[project.urls]
Repository = "https://github.com/austinwin/qpyserve"
Issues = "https://github.com/austinwin/qpyserve/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qpyserve = [
  "py.typed",
  "_starters/common/*",
  "_starters/html/frontend/*",
  "_starters/react/frontend/*",
  "_starters/react/frontend/src/*",
  "_starters/vue/frontend/*",
  "_starters/vue/frontend/src/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

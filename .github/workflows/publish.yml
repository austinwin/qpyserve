name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: python -m pip install --upgrade ".[test,data,database]" twine
      - name: Smoke-test installed wheel's dashboard scaffold
        run: |
          qpyserve new /tmp/qpyserve-release-dashboard --template dashboard
          test -f /tmp/qpyserve-release-dashboard/main.py
          test -f /tmp/qpyserve-release-dashboard/frontend/index.html
          test -f /tmp/qpyserve-release-dashboard/data/sample.csv
          test ! -d /tmp/qpyserve-release-dashboard/__pycache__
          python - <<'PY'
          import runpy
          from fastapi.testclient import TestClient
          module = runpy.run_path("/tmp/qpyserve-release-dashboard/main.py", run_name="wheel_check")
          response = TestClient(module["app"]).post("/api/data/records/query", json={"limit": 3})
          assert response.status_code == 200, response.text
          assert len(response.json()["rows"]) == 3
          PY
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              raise SystemExit(f"Tag {tag!r} does not match package version v{version}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate development Trace and Data Bridge JavaScript
        run: |
          node --check src/qpyserve/_trace_client.js
          node --input-type=module --check < src/qpyserve/_data_client.js
          node --test tests/data_client.test.mjs
      - name: Test actual DuckDB and Arrow Data Bridge queries
        run: python -m pytest -q tests/test_data.py
      - name: Verify React/Vite example builds
        working-directory: examples/counter-react/frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify release version and feature modules in wheel
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init = Path("src/qpyserve/__init__.py").read_text()
          assert f'__version__ = "{version}"' in init
          wheels = glob("dist/*.whl")
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for path in ["qpyserve/_trace_client.js", "qpyserve/_client.py",
                           "qpyserve/_ship.py", "qpyserve/_cli.py",
                           "qpyserve/_data.py", "qpyserve/data.py",
                           "qpyserve/_data_client.js",
                           "qpyserve/_starters/dashboard/main.py",
                           "qpyserve/_starters/dashboard/frontend/index.html",
                           "qpyserve/_starters/dashboard/data/sample.csv"]:
                  assert path in names, f"Missing packaged file: {path}"
          PY
      - name: Verify trace client is included in release wheel
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob("dist/*.whl")[0]) as wheel:
              assert "qpyserve/_trace_client.js" in wheel.namelist()
          PY
      - name: Validate package metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qpyserve/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

  verify_pypi:
    name: Verify published package from PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and smoke-test version from PyPI
        shell: bash
        run: |
          export QPYSERVE_RELEASE_VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          for attempt in $(seq 1 12); do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple/ "qpyserve[data]==$QPYSERVE_RELEASE_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Version $QPYSERVE_RELEASE_VERSION did not appear on PyPI" >&2
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import os
          import qpyserve
          from qpyserve._client import generate_client
          from qpyserve._ship import prepare_ship
          from qpyserve.data import DataBridge
          assert qpyserve.__version__ == os.environ["QPYSERVE_RELEASE_VERSION"]
          assert callable(generate_client)
          assert callable(prepare_ship)
          assert callable(DataBridge)
          PY
          qpyserve --version
          qpyserve new /tmp/qpyserve-pypi-smoke --template react
          qpyserve api /tmp/qpyserve-pypi-smoke --check --json || test "$?" -eq 1
          qpyserve api /tmp/qpyserve-pypi-smoke --json
          qpyserve api /tmp/qpyserve-pypi-smoke --check --json

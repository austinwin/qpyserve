name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    # Temporary one-time release trigger for v0.5.0. Remove after publication.
    branches:
      - main
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release: QPyServe v0.5.0'))
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: python -m pip install --upgrade ".[test]" twine
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              raise SystemExit(f"Tag {tag!r} does not match package version v{version}")
          PY
      - name: Verify one-time release commit uses exact v0.5.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "0.5.0", f"Expected 0.5.0 for the gated release; found {version}"
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate development Trace JavaScript
        run: node --check src/qpyserve/_trace_client.js
      - name: Verify React/Vite example builds
        working-directory: examples/counter-react/frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify 0.5.0 version and feature modules in release wheel
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init = Path("src/qpyserve/__init__.py").read_text()
          assert f'__version__ = "{version}"' in init
          wheels = glob("dist/*.whl")
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for path in ["qpyserve/_trace_client.js", "qpyserve/_client.py",
                           "qpyserve/_ship.py", "qpyserve/_cli.py"]:
                  assert path in names, f"Missing packaged file: {path}"
          PY
      - name: Verify trace client is included in release wheel
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob("dist/*.whl")[0]) as wheel:
              assert "qpyserve/_trace_client.js" in wheel.namelist()
          PY
      - name: Validate package metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  tag_release:
    name: Tag verified 0.5.0 release commit
    needs: build
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: QPyServe v0.5.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v0.5.0 tag on the verified release commit
        shell: bash
        run: |
          git fetch --tags
          if git rev-parse --verify refs/tags/v0.5.0 >/dev/null 2>&1; then
            echo "Tag v0.5.0 already exists; refusing to republish." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.5.0 -m "QPyServe v0.5.0" "$GITHUB_SHA"
          git push origin refs/tags/v0.5.0

  publish:
    name: Upload to PyPI
    needs: [build, tag_release]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.tag_release.result == 'success' ||
       needs.tag_release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qpyserve/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

name: One-time QPyServe 0.6.0 release tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-once-v0.6.0.yml"

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'austinwin/qpyserve' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate exact release version and tag absence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "0.6.0", f"Unexpected version {version}"
          assert '__version__ = "0.6.0"' in Path("src/qpyserve/__init__.py").read_text()
          PY
          if git ls-remote --exit-code --tags origin refs/tags/v0.6.0 > /dev/null 2>&1; then
            echo "::error::v0.6.0 tag already exists; refusing to overwrite"
            exit 1
          fi
      - name: Tag merged commit and dispatch trusted PyPI publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.6.0 -m "QPyServe v0.6.0" "$GITHUB_SHA"
          git push origin refs/tags/v0.6.0
          # Pushes from GITHUB_TOKEN do not trigger workflows; an explicit
          # workflow_dispatch is allowed and executes publish.yml on the tag.
          gh workflow run publish.yml --ref v0.6.0
          echo "Dispatched publish.yml for v0.6.0 at $GITHUB_SHA"

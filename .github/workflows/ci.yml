name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q
      - run: python -m build

  react-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Verify Trace browser correlation and privacy
        run: node --test tests/trace_browser.test.cjs
      - name: Start React and FastAPI with one Python command
        working-directory: examples/counter-react
        run: |
          python main.py > /tmp/qpyserve.log 2>&1 &
          echo $! > /tmp/qpyserve.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:1111/api/count > /tmp/api.json && curl --fail --silent http://127.0.0.1:1111/ > /tmp/index.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qpyserve.log
          exit 1
      - name: Build React frontend without manual npm command
        working-directory: examples/counter-react
        run: python main.py --build
      - name: Stop local processes
        if: always()
        run: |
          if test -f /tmp/qpyserve.pid; then kill $(cat /tmp/qpyserve.pid) || true; fi

  generated-starters:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Generate all starter types and verify doctor
        run: |
          qpyserve new /tmp/qps-html
          qpyserve new /tmp/qps-react --template react
          qpyserve new /tmp/qps-vue --template vue
          qpyserve doctor /tmp/qps-html --json
          qpyserve doctor /tmp/qps-react --json
          qpyserve doctor /tmp/qps-vue --json
      - name: Compile generated React and Vue projects
        run: |
          python /tmp/qps-react/main.py --build
          python /tmp/qps-vue/main.py --build
          test -f /tmp/qps-react/frontend/dist/index.html
          test -f /tmp/qps-vue/frontend/dist/index.html
      - name: Confirm starter resources exist in wheel
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          for template in ("html", "react", "vue"):
              assert f"qpyserve/_starters/{template}/frontend/index.html" in names
          PY


  runtime-integration:
    name: Runtime integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Verify real proxy, reload, Trace and shutdown
        run: python tests/runtime_smoke.py

  ship-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Generate deployment assets for React starter
        run: |
          qpyserve new /tmp/qps-ship-react --template react
          qpyserve ship /tmp/qps-ship-react
          test -f /tmp/qps-ship-react/Dockerfile
          test -f /tmp/qps-ship-react/render.yaml
      - name: Build production container
        run: docker build -t qps-ship-react /tmp/qps-ship-react
      - name: Verify production origin, API, and disabled Trace
        run: |
          docker run -d --name qps-ship-test -p 127.0.0.1:18501:10000 qps-ship-react
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18501/__qpyserve/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:18501/api/hello >/dev/null &&
               curl --fail --silent http://127.0.0.1:18501/ >/dev/null; then
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18501/__qpyserve/trace)
              test "$status" = 404
              exit 0
            fi
            sleep 2
          done
          docker logs qps-ship-test
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f qps-ship-test || true

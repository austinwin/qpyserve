name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q
      - run: python -m build

  react-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Verify Trace browser correlation and privacy
        run: node --test tests/trace_browser.test.cjs
      - name: Start React and FastAPI with one Python command
        working-directory: examples/counter-react
        run: |
          python main.py > /tmp/qpyserve.log 2>&1 &
          echo $! > /tmp/qpyserve.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:1111/api/count > /tmp/api.json && curl --fail --silent http://127.0.0.1:1111/ > /tmp/index.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qpyserve.log
          exit 1
      - name: Build React frontend without manual npm command
        working-directory: examples/counter-react
        run: python main.py --build
      - name: Stop local processes
        if: always()
        run: |
          if test -f /tmp/qpyserve.pid; then kill $(cat /tmp/qpyserve.pid) || true; fi

  generated-starters:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Generate all starter types and verify doctor
        run: |
          qpyserve new /tmp/qps-html
          qpyserve new /tmp/qps-react --template react
          qpyserve new /tmp/qps-vue --template vue
          qpyserve doctor /tmp/qps-html --json
          qpyserve doctor /tmp/qps-react --json
          qpyserve doctor /tmp/qps-vue --json
      - name: Compile generated React and Vue projects
        run: |
          python /tmp/qps-react/main.py --build
          python /tmp/qps-vue/main.py --build
          test -f /tmp/qps-react/frontend/dist/index.html
          test -f /tmp/qps-vue/frontend/dist/index.html
      - name: Confirm starter resources exist in wheel
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          for template in ("html", "react", "vue"):
              assert f"qpyserve/_starters/{template}/frontend/index.html" in names
          PY


  runtime-integration:
    name: Runtime integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Verify real proxy, reload, Trace and shutdown
        run: python tests/runtime_smoke.py

  ship-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Generate deployment assets for React starter
        run: |
          qpyserve new /tmp/qps-ship-react --template react
          qpyserve ship /tmp/qps-ship-react
          test -f /tmp/qps-ship-react/Dockerfile
          test -f /tmp/qps-ship-react/render.yaml
      - name: Build production container
        run: docker build -t qps-ship-react /tmp/qps-ship-react
      - name: Verify production origin, API, and disabled Trace
        run: |
          docker run -d --name qps-ship-test -p 127.0.0.1:18501:10000 qps-ship-react
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18501/__qpyserve/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:18501/api/hello >/dev/null &&
               curl --fail --silent http://127.0.0.1:18501/ >/dev/null; then
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18501/__qpyserve/trace)
              test "$status" = 404
              exit 0
            fi
            sleep 2
          done
          docker logs qps-ship-test
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f qps-ship-test || true

  typed-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Generate real Pydantic + FastAPI typed API
        run: |
          qpyserve new /tmp/qps-typed --template react
          cat > /tmp/qps-typed/api_typed.py <<'PY'
          from fastapi import FastAPI, HTTPException
          from pydantic import BaseModel

          app = FastAPI()
          class Sensor(BaseModel):
              sensor_id: int
              pressure: float
              description: str | None = None

          @app.get("/api/sensors/{sensor_id}", response_model=Sensor, operation_id="getSensor")
          def get_sensor(sensor_id: int, verbose: bool = False):
              return Sensor(sensor_id=sensor_id, pressure=41.5)

          @app.post("/api/sensors", response_model=Sensor, operation_id="createSensor")
          def create_sensor(sensor: Sensor):
              return sensor

          @app.get("/api/failure", operation_id="testFailure")
          def fail():
              raise HTTPException(503)
          PY
          qpyserve api /tmp/qps-typed --app api_typed:app --json
          qpyserve api /tmp/qps-typed --app api_typed:app --check
      - name: Typecheck real API contracts and exercise browser fetch
        run: |
          cat > /tmp/qps-typed/frontend/src/check.ts <<'TS'
          import { api, QPyServeApiError, type Schemas } from "./qpyserve-api";

          // These must typecheck or fail at compile time without invoking fetch.
          if (false) {
            const req: Promise<Schemas["Sensor"]> = api.getSensor({
              path: { sensor_id: 7 }, query: { verbose: true },
            });
            void req;
            // @ts-expect-error numeric path parameter cannot be a string
            api.getSensor({ path: { sensor_id: "bad" } });
            // @ts-expect-error missing required Pydantic JSON body
            api.createSensor({});
            // @ts-expect-error incorrect JSON body schema
            api.createSensor({ body: { sensor_id: 2, pressure: "wrong" } });
            // @ts-expect-error nonexistent endpoint
            api.unknownEndpoint();
          }
          const calls: Array<{ input: string; init: RequestInit | undefined }> = [];
          globalThis.fetch = async (input, init) => {
            calls.push({ input: String(input), init });
            return new Response(JSON.stringify({ sensor_id: 7, pressure: 41.5 }), {
              status: 200, headers: { "content-type": "application/json" },
            });
          };
          void (async () => {
            const reading = await api.getSensor({
              path: { sensor_id: 7 }, query: { verbose: true },
            });
            if (reading.sensor_id !== 7) throw Error("bad JSON response");
            if (calls[0].input !== "/api/sensors/7?verbose=true") throw Error("bad URL");
            await api.createSensor({ body: { sensor_id: 7, pressure: 41.5 } });
            if (calls[1].input !== "/api/sensors") throw Error("bad POST URL");
            if (calls[1].init?.body !== JSON.stringify({ sensor_id: 7, pressure: 41.5 })) {
              throw Error("bad POST body");
            }
            globalThis.fetch = async () => new Response("temporary", {
              status: 503,
              headers: { "x-qpyserve-trace-id": "0123456789abcdef" },
            });
            try {
              await api.testFailure();
              throw Error("expected failure");
            } catch (error) {
              if (!(error instanceof QPyServeApiError)) throw error;
              if (error.status !== 503 || error.traceId !== "0123456789abcdef") {
                throw Error("missing correlated trace");
              }
            }
          })();
          TS
          cd /tmp/qps-typed/frontend
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock typescript@5.9.3
          ./node_modules/.bin/tsc --strict --skipLibCheck --target ES2022 --module commonjs --moduleResolution node --lib DOM,ES2022 --outDir /tmp/qps-typed-compiled src/check.ts
          node /tmp/qps-typed-compiled/check.js

  data-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install opt-in big data dependencies
        run: python -m pip install -e '.[data,test]'
      - name: Real DuckDB million-row queries and streamed Arrow roundtrips
        run: python -m pytest -q tests/test_data.py
      - name: Verify standalone JS client syntax
        run: node --input-type=module --check < src/qpyserve/_data_client.js
      - name: Check wheel and source distribution include bridge assets
        run: |
          python -m build
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob("dist/*.whl")[0]) as wheel:
              names = set(wheel.namelist())
              assert "qpyserve/_data.py" in names
              assert "qpyserve/_data_client.js" in names
          PY

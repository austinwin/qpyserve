<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QPyServe Data Bridge Demo</title>
<style>
:root{font:14px/1.5 system-ui,Arial,sans-serif;background:#f5f7fa;color:#21304a}
*{box-sizing:border-box}
main{max-width:1020px;margin:36px auto;padding:0 20px}
h1{font-size:24px;letter-spacing:-.5px;margin:0}
p{color:#617087;margin:4px 0 18px}
.panel{background:#fff;border:1px solid #dde3eb;border-radius:12px;box-shadow:0 1px 4px #e6e9ed;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;padding:16px;border-bottom:1px solid #e4eaf1}
label{display:grid;gap:4px;font-size:12px;font-weight:650}
select,input,button{font:inherit;border:1px solid #cbd4e1;border-radius:6px;padding:7px 10px;background:#fff}
button{cursor:pointer}
button.primary{background:#1663b4;color:#fff;border-color:#1663b4}
button:disabled{opacity:.5;cursor:not-allowed}
.summary{padding:12px 16px;background:#f9fafc;border-bottom:1px solid #e4eaf1;font-size:12px;color:#53627c}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid #eef1f5;white-space:nowrap}
th{font-size:12px;color:#5c6c83;background:#fbfcfd}
tr:last-child td{border-bottom:0}
.flag{border-radius:4px;padding:3px 7px;background:#fef2f2;color:#b52633;font-weight:650}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid #e4eaf1}
#error{color:#b52633;font-size:12px;margin:10px 0}
</style>
</head>
<body>
<main>
<h1>QPyServe Data Bridge</h1>
<p>Query one million records without downloading one million rows. Filtering, sorting and paging run inside DuckDB.</p>
<div class="panel">
<div class="toolbar">
<label>Minimum pressure (PSI)<input id="pressure" type="number" value="60" min="0" max="200"></label>
<label>Status<select id="status"><option value="">All</option><option value="Alert">Alert</option><option value="Normal">Normal</option></select></label>
<label>Sort<select id="sort"><option value="desc">Highest IDs first</option><option value="asc">Lowest IDs first</option></select></label>
<button id="apply" class="primary">Run query</button>
</div>
<div id="summary" class="summary">Loading schema...</div>
<div class="scroll">
<table><thead><tr><th>ID</th><th>Sensor</th><th>Pressure (PSI)</th><th>Status</th></tr></thead>
<tbody id="rows"></tbody></table>
</div>
<div id="error" role="alert"></div>
<div class="foot"><button id="prev">Previous</button><span id="page">Page 1</span><button id="next">Next</button></div>
</div>
</main>
<script type="module">
import { dataset } from "/api/data/_client.js";
const readings = dataset("readings");
const el = id => document.getElementById(id);
let page = 0;
let next = false;
let active;
const escapeText = value => String(value == null ? "" : value).replace(/[&<>"']/g, x => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[x]));
async function load() {
  if (active) active.abort();
  active = new AbortController();
  el("error").textContent = "";
  el("summary").textContent = "Running server-side query...";
  const filters = [
    {column:"pressure_psi", op:"gte", value:Number(el("pressure").value) || 0}
  ];
  if (el("status").value) filters.push({column:"status",op:"eq",value:el("status").value});
  try {
    const started = performance.now();
    const data = await readings.query({
      columns:["id","sensor","pressure_psi","status"],
      filters,
      sort:[{column:"id",desc:el("sort").value==="desc"}],
      offset:page * 50,
      limit:50
    },active.signal);
    next = data.has_more;
    el("rows").innerHTML = data.rows.map(row => (
      `<tr><td>${escapeText(row.id)}</td><td>${escapeText(row.sensor)}</td>` +
      `<td>${escapeText(row.pressure_psi)}</td><td>${row.status==="Alert" ?
      '<span class="flag">Alert</span>' : 'Normal'}</td></tr>`
    )).join("");
    el("summary").textContent = `Server returned ${data.rows.length} rows in ${(performance.now()-started).toFixed(0)} ms. Dataset: 1,000,000 rows.`;
    el("prev").disabled = page===0;
    el("next").disabled = !next;
    el("page").textContent = `Page ${page+1}`;
  } catch (error) {
    if (error.name !== "AbortError") el("error").textContent = String(error.message ?? error);
  }
}
el("apply").onclick = () => {page=0;load()};
el("prev").onclick = () => {page=Math.max(0,page-1);load()};
el("next").onclick = () => {if(next){page++;load()}};
load();
</script>
</body>
</html>

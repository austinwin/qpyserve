<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QPyServe Starter</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1220; color: #f5f8ff; }
    main { max-width: 480px; margin: 24px; padding: 32px; border: 1px solid #26334e; border-radius: 18px; background: #141e31; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: #b3bfd4; line-height: 1.5; }
    button { background: #7ab3ff; color: #101726; border: 0; border-radius: 9px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #acd0ff; }
    output { display: block; margin-top: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
    a { color: #a6cbff; }
  </style>
</head>
<body>
  <main>
    <h1>QPyServe is running.</h1>
    <p>One command, one origin, real FastAPI. Your frontend is plain HTML and JavaScript.</p>
    <button id="call" type="button">Call Python API</button>
    <output id="result" role="status" aria-live="polite">Ready</output>
    <p><a href="/docs">API documentation</a></p>
  </main>
  <script>
    document.querySelector('#call').addEventListener('click', async () => {
      const output = document.querySelector('#result');
      output.textContent = 'Loading...';
      try {
        const response = await fetch('/api/hello');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const {message, time} = await response.json();
        output.textContent = `${message}\n${time}`;
      } catch (error) {
        output.textContent = `API error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
